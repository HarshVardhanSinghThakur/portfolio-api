# On every push: test. On main: build the image, push it to GitHub's registry, and roll it out on the Oracle VM.
# One-time setup (secrets, the VM side): see the deployment runbook.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # registry names must be lowercase, GitHub user names may not be
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=,format=short # e.g. ghcr.io/you/portfolio-api:a1b2c3d
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64 # the Oracle micro is amd64; arm64 keeps a move to an Arm VM free
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    concurrency: deploy-micro # never two rollouts at once
    steps:
      - name: Roll out on the Oracle VM
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$KEY" > key
          printf '%s\n' "$HOST_KEY" > known_hosts
          # The key can only run /usr/local/bin/portfolio-deploy; this is its whole command line.
          ssh -i key -o BatchMode=yes -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            "deploy@$HOST" "api ${GITHUB_SHA::7}"
